http_port 3128
acl tls method CONNECT
acl https_port port 443
acl learning_hosts dstdomain -n oauth2.googleapis.com www.googleapis.com sheets.googleapis.com slides.googleapis.com docs.googleapis.com accounts.google.com
acl author_hosts dstdomain -n auth.openai.com api.openai.com chatgpt.com
http_access allow tls https_port learning_hosts
http_access allow tls https_port author_hosts
http_access deny all
cache deny all
access_log none
