name: Deploy to VPS

# Runs the VPS's own deploy step over SSH — the SSH key used here is scoped
# to the meabeclick user (not root) and forced to run exactly this command
# server-side (see meabeclick's ~/.ssh/authorized_keys), so a leaked key
# can only ever trigger a redeploy of this repo, nothing else.
#
# CI verifies code and UI in parallel, builds and smokes the release image,
# publishes the verified digest to GHCR on main, deploys and verifies that
# exact digest in staging, and only then promotes the release to production.
on:
  push:
    branches: [main]
  # Pull requests run the same gates — tests, type-check, UI journeys, AND a
  # real image build + smoke — but never push an image or deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Promote to production after staging verification passes (main branch only)
        type: boolean
        default: true

# Cancel superseded PR runs immediately to speed up iteration, while never
# cancelling or queuing main runs against each other (staging serializes on
# the VPS lock, and production serializes in the deploy job below).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR requires an all-lowercase image path. Derive it from
  # github.repository rather than hardcoding the owner/repository here, so a
  # future transfer cannot make CI publish somewhere Compose never pulls.
  REGISTRY: ghcr.io

jobs:
  verify-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tests/characterization/harness.mjs spawns build/index.js (the
      # adapter-node production build) for every characterization test, so
      # the build must exist before npm test runs.
      - name: Build
        run: npm run build

      # Must be green BEFORE the image is built — a broken build must fail
      # here, not on the VPS serving users. svelte-check is the
      # sveltekit-side type/template check.
      - name: Run tests
        run: npm test

      # Runs svelte-check and enforces a ceiling on WARNINGS as well as
      # errors. `npm run check` alone ignored warnings, so the count drifted
      # and each new one joined a pile nobody read — a pile that turned out
      # to hold a real bug (see the script's header, and #79).
      - name: Type-check
        run: node scripts/check-warnings.mjs

  verify-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the merge checkout being built; compare its complete graph
          # with the PR base, including deleted/renamed imports.
          fetch-depth: 0

      - name: Configure PR UI evidence directory
        run: |
          echo "PR_QA_DIR=$RUNNER_TEMP/pr-ui-verification" >> "$GITHUB_ENV"
          echo "PR_QA_PLAN=$RUNNER_TEMP/pr-ui-verification/impact.json" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select affected pages and journeys
        id: pr_qa_select
        run: node scripts/pr-qa/select.mjs
        env:
          PR_QA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_QA_EVENT: ${{ github.event_name }}

      - name: Build
        if: steps.pr_qa_select.outputs.run_ui == 'true'
        run: npm run build

      - name: Resolve Playwright version
        id: playwright_version
        if: steps.pr_qa_select.outputs.run_ui == 'true'
        run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.pr_qa_select.outputs.run_ui == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}

      # The native player runtime is serialized into standalone HTML. Only a real
      # browser exercises it.
      - name: Install learning test browser
        if: steps.pr_qa_select.outputs.run_ui == 'true'
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Verify affected user journeys
        id: pr_qa_run
        if: steps.pr_qa_select.outputs.run_ui == 'true'
        run: npm run test:qa

      - name: Check visual calibration pilot in Chromium
        id: qa_pilot
        if: steps.pr_qa_select.outputs.learning == 'true'
        run: npm run test:pilot:browser
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/tutor-workspace-ui/visual-pilot

      - name: Check tutor workspace in Chromium
        id: qa_workspace
        if: steps.pr_qa_select.outputs.workspace == 'true' || steps.pr_qa_select.outputs.tutor_create == 'true'
        run: npm run test:workspace:browser
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/tutor-workspace-ui

      - name: Check marketing charts in Chromium
        id: qa_charts
        if: steps.pr_qa_select.outputs.workspace == 'true'
        run: node tests/browser/marketing-trends.mjs
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/tutor-workspace-ui/charts

      - name: Save synthetic workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutor-workspace-ui
          path: ${{ runner.temp }}/tutor-workspace-ui
          if-no-files-found: ignore
          retention-days: 7

      - name: Check Google sign-in and family onboarding in Chromium
        id: qa_auth
        if: steps.pr_qa_select.outputs.invitations == 'true'
        run: npm run test:auth:browser
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/apple-role-journeys/google-onboarding

      - name: Check role journeys, responsive UI and contrast in Chromium
        id: qa_matrix
        if: steps.pr_qa_select.outputs.run_ui == 'true'
        run: npm run test:ui:browser
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/apple-role-journeys

      - name: Save synthetic role journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-role-journeys
          path: ${{ runner.temp }}/apple-role-journeys
          if-no-files-found: ignore
          retention-days: 7

      - name: Report PR UI verification
        if: always()
        run: node scripts/pr-qa/report.mjs
        env:
          QA_SELECTION_OUTCOME: ${{ steps.pr_qa_select.outcome }}
          QA_RUN_OUTCOME: ${{ steps.pr_qa_run.outcome }}
          QA_PILOT_OUTCOME: ${{ steps.qa_pilot.outcome }}
          QA_WORKSPACE_OUTCOME: ${{ steps.qa_workspace.outcome }}
          QA_CHARTS_OUTCOME: ${{ steps.qa_charts.outcome }}
          QA_AUTH_OUTCOME: ${{ steps.qa_auth.outcome }}
          QA_MATRIX_OUTCOME: ${{ steps.qa_matrix.outcome }}

      - name: Save PR UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-ui-verification
          path: ${{ runner.temp }}/pr-ui-verification
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: [verify-code, verify-ui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Require code and UI verification
        if: needs.verify-code.result != 'success' || needs.verify-ui.result != 'success'
        run: |
          echo "::error::Verification did not succeed (verify-code=${{ needs.verify-code.result }}, verify-ui=${{ needs.verify-ui.result }})." >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify release image
        timeout-minutes: 2
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: bash scripts/smoke-release-image.sh "$IMAGE"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          LATEST: ${{ steps.image.outputs.name }}:latest
        run: |
          set -euo pipefail
          docker push "$IMAGE" | tee "$RUNNER_TEMP/image-push.log"
          digest=$(awk '$2 == "digest:" {print $3}' "$RUNNER_TEMP/image-push.log")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker tag "$IMAGE" "$LATEST"
          docker push "$LATEST"

  staging:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.meabeclick.com
    outputs:
      deployed: ${{ steps.deploy_staging.outputs.deployed }}
    # The VPS serializes staging and checks main under the deployment lock.
    # A shared Actions queue can drop the current run when an older build finishes late.
    permissions:
      packages: read
    steps:
      - name: Deploy and verify the published digest in staging
        id: deploy_staging
        timeout-minutes: 10
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          STAGING_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          umask 077
          key="$RUNNER_TEMP/staging_key"
          known_hosts="$RUNNER_TEMP/staging_known_hosts"
          out_file="$RUNNER_TEMP/staging-deploy.log"
          trap 'rm -f "$key" "$out_file"' EXIT
          printf '%s\n' "$STAGING_KEY" > "$key"
          printf '%s\n' '76.13.59.4 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMbxyAgHjitpKzLCMUz3H0k4nnJ8o2XYJb7t2MEEDfJR' > "$known_hosts"
          expected_confirm="Verified staging startup, booking page, tutor session, and HTTPS ingress for ${IMAGE_DIGEST}"
          for attempt in 1 2 3 4 5; do
            if printf '%s\n' "$GITHUB_SHA" "$IMAGE_DIGEST" "$GITHUB_ACTOR" "$GH_TOKEN" | ssh -T -i "$key" \
                -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
                meabeclick-stage@76.13.59.4 >"$out_file" 2>&1; then
              cat "$out_file"
              if grep -Fqx "$expected_confirm" "$out_file"; then
                echo "deployed=true" >> "$GITHUB_OUTPUT"
                {
                  echo "### Staging verified"
                  echo "- Commit: \`$GITHUB_SHA\`"
                  echo "- Digest: \`$IMAGE_DIGEST\`"
                  echo "- URL: https://staging.meabeclick.com"
                } >> "$GITHUB_STEP_SUMMARY"
              elif grep -Fq "Skipped staging commit ${GITHUB_SHA} " "$out_file"; then
                echo "deployed=false" >> "$GITHUB_OUTPUT"
                echo "### Staging skipped (superseded by newer main commit)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::Staging deploy did not confirm HTTPS ingress verification for ${IMAGE_DIGEST}." >&2
                exit 1
              fi
              exit 0
            else
              status=$?
              cat "$out_file" >&2 || true
              if [[ "$status" != 255 || "$attempt" == 5 ]]; then exit "$status"; fi
              sleep 30
            fi
          done

  deploy:
    needs: [build, staging]
    # Never on a pull request, and never before staging verifies the same commit.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.staging.outputs.deployed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy_production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://meabeclick.com
    # One deploy touches the box at a time.
    #
    # Not a nicety. The forced command is `git pull && export
    # APP_TAG=$(git rev-parse HEAD) && docker compose pull && up`, and two of
    # those interleaving read each other's state: deploy A pulls commit X,
    # deploy B pulls commit Y, and A then resolves APP_TAG to Y — shipping an
    # image that does not match the checkout A was deploying. Two `docker
    # compose up` runs racing on one project is its own hazard.
    #
    # This is also the only difference between the deploys that have failed
    # and the ones that have not: #27 and #28 merged forty seconds apart,
    # their deploys overlapped, and both timed out; every deploy that ran
    # alone has succeeded.
    #
    # cancel-in-progress stays false so a queued deploy waits rather than
    # being dropped — the newest queued run wins, which is what you want.
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    permissions:
      # Only to read main's current tip for the superseded check below.
      contents: read
    steps:
      - name: Deploy over SSH
        id: ssh_deploy
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          PRODUCTION_DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [[ -z "${PRODUCTION_DEPLOY_SSH_KEY:-}" ]]; then
            echo "::error::PRODUCTION_DEPLOY_SSH_KEY is not configured in the production environment." >&2
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/production_deploy_key"
          known_hosts="$RUNNER_TEMP/production_known_hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$PRODUCTION_DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' '76.13.59.4 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMbxyAgHjitpKzLCMUz3H0k4nnJ8o2XYJb7t2MEEDfJR' > "$known_hosts"

          # Skip early if main has already moved past this commit; the VPS
          # forced script also re-checks origin/main under its deploy lock so
          # a newer commit can never reach production without passing staging.
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha 2>/dev/null || true)
          if [[ "$tip" =~ ^[0-9a-f]{40}$ ]] && [ "$tip" != "${{ github.sha }}" ]; then
            echo "::notice::Superseded — main is now $tip, this run is for ${{ github.sha }}."
            echo "::notice::Skipping; the run for $tip deploys both."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pipe the exact verified commit SHA and staging-verified image
          # digest to the VPS forced command (/usr/local/sbin/meabeclick-production-deploy).
          # The dedicated PRODUCTION_DEPLOY_SSH_KEY is authorized ONLY for that
          # forced command, so activation fails closed if a host still carries
          # an unpinned legacy deploy key.
          expected_confirm="Deployed and verified production commit ${GITHUB_SHA} (${IMAGE_DIGEST})"
          attempt=0
          while true; do
            # Capture rather than stream, so the failure can be classified.
            # Still shown in full either way.
            if out=$(printf '%s\n' "$GITHUB_SHA" "$IMAGE_DIGEST" | ssh -T -i "$key" \
                -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
                -o ConnectTimeout=20 \
                meabeclick@76.13.59.4 2>&1); then
              echo "$out"
              if printf '%s\n' "$out" | grep -Fqx "$expected_confirm"; then
                echo "deployed=true" >> "$GITHUB_OUTPUT"
                break
              fi
              if printf '%s\n' "$out" | grep -Fq "Skipped production commit ${GITHUB_SHA} "; then
                echo "deployed=false" >> "$GITHUB_OUTPUT"
                break
              fi
              echo "::error::Production SSH exited 0 without confirming commit ${GITHUB_SHA} (${IMAGE_DIGEST})." >&2
              exit 1
            fi
            echo "$out"

            # An image GHCR does not have is not a connectivity problem, and
            # retrying cannot conjure it.
            if printf '%s' "$out" | grep -q 'failed to resolve reference'; then
              echo "::error::The box resolved APP_TAG to a commit whose image is not in GHCR yet." >&2
              echo "::error::main moved ahead mid-deploy; the run for that newer commit will deploy it." >&2
              exit 1
            fi

            # A diverged checkout is not transient either.
            if printf '%s' "$out" | grep -q 'Not possible to fast-forward'; then
              echo "::error::The box's checkout has diverged from main — history was rewritten, so it cannot fast-forward." >&2
              echo "::error::Run once on the VPS, as meabeclick:" >&2
              echo "::error::  cd /home/meabeclick/mea-beclick && git fetch origin && git reset --hard origin/main" >&2
              echo "::error::Then re-run this job. Nothing is wrong with the network." >&2
              exit 1
            fi

            # Local uncommitted edits on the VPS checkout are also non-transient.
            if printf '%s' "$out" | grep -q 'Your local changes to the following files would be overwritten'; then
              echo "::error::The box's checkout has local edits to tracked files that block git merge --ff-only." >&2
              echo "::error::Inspect and reconcile them on the VPS, as meabeclick:" >&2
              echo "::error::  cd /home/meabeclick/mea-beclick && git status && git diff" >&2
              echo "::error::Commit/track needed changes in Git, clear local edits, and re-run this job. Nothing is wrong with the network." >&2
              exit 1
            fi

            # A digest mismatch between the commit tag and the staging-verified
            # digest is never transient.
            if printf '%s' "$out" | grep -q 'does not match verified'; then
              echo "::error::Production VPS refused rollout because image digest verification failed." >&2
              exit 1
            fi

            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              # Non-transient causes are classified above. Anything reaching
              # here really did fail five times, so the firewall is a fair
              # first guess — but say it is a guess.
              echo "::error::Deploy failed after 5 attempts over ~3 minutes, with no recognised cause in the output." >&2
              echo "::error::If every attempt timed out before sshd answered, check the VPS's edge/cloud firewall, not just ufw." >&2
              exit 1
            fi
            echo "SSH attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

      - name: Verify production after deploy
        if: steps.ssh_deploy.outputs.deployed == 'true'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/prod-booking.html"
          trap 'rm -f "$body_file"' EXIT

          ok=false
          for attempt in 1 2 3 4 5 6; do
            me=$(curl --silent --show-error --max-time 10 https://meabeclick.com/api/me || true)
            code=$(curl --silent --show-error --max-time 10 --output "$body_file" --write-out '%{http_code}' https://meabeclick.com/booking || true)
            if [[ "$me" == '{"authenticated":false}' && "$code" == 200 ]] && grep -qE '<h1([[:space:]][^>]*)?>הזמנת שיעור</h1>' "$body_file"; then
              ok=true
              break
            fi
            echo "Waiting for production health ($attempt/6): /api/me=${me:-error} /booking=$code"
            sleep 5
          done

          if [[ "$ok" != true ]]; then
            echo "::error::Production post-deploy verification failed for https://meabeclick.com" >&2
            exit 1
          fi

          {
            echo "### Production deployed and verified"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image digest: \`${{ needs.build.outputs.digest }}\`"
            echo "- URL: https://meabeclick.com"
          } >> "$GITHUB_STEP_SUMMARY"
